name: hg_native
description: Native capabilities for hg_flutter (SecureStore + OnDeviceAi).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.example.hg_native
        pluginClass: HgNativePlugin
      ios:
        pluginClass: HgNativePlugin
