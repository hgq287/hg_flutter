name: hg_flutter
description: "Template for Desktop & Mobile apps, inspired by Flutter & Dart."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  logger: ^2.6.2
  hg_native:
    path: packages/hg_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.1

flutter:
  uses-material-design: true
  generate: true
